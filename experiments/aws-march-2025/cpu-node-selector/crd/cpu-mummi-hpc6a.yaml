apiVersion: state-machine.converged-computing.org/v1alpha1
kind: StateMachine
metadata:
  name: mummi
spec:
  manager:
    pullPolicy: "Always"
  workflow:
    completed: 3
    prefix: "structure_"

  # Allow one full group (of one type) to run at once
  cluster:
    maxSize: 3
  
  # These are also default 1 thread per core
  jobs:

  # 2.88 / hour
  - name: createsim-hpc6a-48xlarge
    properties:
      node-selector: '{"node.kubernetes.io/instance-type": "hpc6a.48xlarge"}'
      always-succeed: "1"
    config:
      nodes: 1
      walltime: '0:45:00'
      coresPerTask: 92
    image: ghcr.io/converged-computing/mummi-experiments:cpu-node-selector
    registry:
      push: createsim-hpc6a-48xlarge
    script: /bin/bash /entrypoint.sh
