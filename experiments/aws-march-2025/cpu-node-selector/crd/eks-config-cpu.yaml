apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: mini-mummi
  region: us-east-1
  version: "1.27"

iam:
  withOIDC: true
  serviceAccounts:
  - metadata:
      name: cluster-autoscaler
      namespace: kube-system
    attachPolicy:
      Version: "2012-10-17"
      Statement:
      - Effect: Allow
        Action:
        - "autoscaling:DescribeAutoScalingGroups"
        - "autoscaling:DescribeAutoScalingInstances"
        - "autoscaling:DescribeLaunchConfigurations"
        - "ec2:DescribeImages"
        - "ec2:DescribeInstanceTypes"
        - "ec2:DescribeLaunchTemplateVersions"
        - "ec2:GetInstanceTypesFromInstanceRequirements"
        - "autoscaling:DescribeTags"
        - "autoscaling:SetDesiredCapacity"
        - "autoscaling:TerminateInstanceInAutoScalingGroup"
        - "eks:DescribeNodegroup"        
        Resource: '*'

availabilityZones: ["us-east-1a", "us-east-1b", "us-east-1c"]
managedNodeGroups:
  - name: workers-control-plane
    availabilityZones: ["us-east-1b"]
    instanceType: m6a.4xlarge
    desiredCapacity: 1
    minSize: 1
    maxSize: 1

  - name: workers-c7g-16xlarge
    iam:
      withAddonPolicies:
        autoScaler: true 
    availabilityZones: ["us-east-1b"]
    instanceType: c7g.16xlarge
    volumeSize: 150
    volumeType: gp2
    labels:
      nodegroup: c7g-16xlarge
    desiredCapacity: 0
    minSize: 0
    maxSize: 3
    tags:
      nodegroup: c7g-16xlarge
      kubernetes.io/cluster/mini-mummi: "owned"
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/mini-mummi: "owned"
      k8s.io/cluster-autoscaler/node-template/label/nodegroup: c7g-16xlarge
    propagateASGTags: true
    ssh:
      allow: true
      publicKeyPath: ~/.ssh/id_eks.pub

  - name: workers-c7a-12xlarge
