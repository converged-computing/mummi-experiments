apiVersion: state-machine.converged-computing.org/v1alpha1
kind: StateMachine
metadata:
  name: mummi
spec:
  manager:
    interactive: false
  workflow:
    # Number of tests to do per cpu type
    completed: 6
    prefix: "structure_"
  cluster:
    maxSize: 6

  jobs:
  - name: createsim
    properties:
      node-selector:
        node.kubernetes.io/instance-type: c7a.4xlarge
    config:
      nodes: 1
      walltime: '0:60:00'
      coresPerTask: 6
      nproc: 94
    image: ghcr.io/converged-computing/mummi-experiments:cpu-node-selector
    registry:
      push: createsim
    script: /bin/bash /entrypoint.sh
