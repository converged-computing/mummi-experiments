  # These are physical core counts
  # 2.463 / hour
  - name: cganalysis-c7a-12xlarge
    properties:
      node-selector: '{"nodegroup": "c7a-12xlarge"}'
      always-succeed: "1"
      save-path: "/opt"
    config:
      nodes: 1
      walltime: '0:45:00'
      # 48 physical cores total
      coresPerTask: 46
    image: ghcr.io/converged-computing/mummi-experiments:node-selector-cganalysis-cpu
    registry:
      push: cganalysis-c7a-12xlarge
    script: /bin/bash /entrypoint.sh no

