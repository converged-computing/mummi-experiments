apiVersion: state-machine.converged-computing.org/v1alpha1
kind: StateMachine
metadata:
  name: mummi
spec:
  registry:
    nodeSelector: m6a.4xlarge
  manager:
    pullPolicy: "Always"
    nodeSelector: m6a.4xlarge
  workflow:
    completed: 3
    prefix: "structure_"

  # Allow one full group (of one type) to run at once
  cluster:
    maxSize: 3
  
  # These are also default 1 thread per core
  jobs:

