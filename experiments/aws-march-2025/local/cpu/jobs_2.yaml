name: cganalysis
config:
  nodes: 1
  nproc: 94
  coresPerTask: 6
  command: /usr/local/bin/singularity exec /home/ubuntu/containers/mini-mummi_cganalysis.sif bash ./entrypoint.sh
script: |
  MUMMI_APP=/opt/clones/mummi-ras
  MUMMI_RESOURCES=/opt/clones/mummi_resources
  export MUMMI_APP MUMMI_RESOURCES
  export MUMMI_ROOT=$(dirname $(dirname $outpath))
  locpath=$(dirname $outpath)
  export OMPI_COMM_WORLD_RANK=1
  export OMP_NUM_THREADS=6
  mkdir -p $locpath/tmp
  cd ${locpath}
  ls
  cframe=0
  echo ">> xtclast = $xtclast, cframe = $cframe"
  mummi_cganalysis \
        --simname ${jobid} \
        --path $locpath/createsim \
        --pathremote $outpath \
        --siminputs $outpath \
        --fstype mummi \
        --fbio mummi \
        --simbin gmx \
        --backend GROMACS_PARTS \
        --simcores 6 \
        --nprocs 1 \
        --stopsimtime 100 \
        --simruntime 0.5 \
        --logstdout \
        --loglevel 2 \
        --no-gpu \
        --mini \
        --fcount $cframe
      echo $?
