name: createsim
# Note that we could add an output directoy here, but are writing into the script directly instead
config:
  nodes: 1
  nproc: 94
  coresPerTask: 6
  command: singularity exec /home/ubuntu/containers/mini-mummi_createsims.sif bash ./entrypoint.sh
script: |
  MUMMI_APP=/opt/clones/mummi-ras
  MUMMI_RESOURCES=/opt/clones/mummi_resources
  export MUMMI_APP MUMMI_RESOURCES
  export MUMMI_ROOT=$(dirname $(dirname $outpath))
  locpath=$(dirname $outpath)
  mkdir -p $locpath/tmp
  cd ${locpath}
  export OMP_NUM_THREADS=6
  outfile=$(ls mlrunner/structure*.gro)
  cp ${outfile} $locpath/tmp/${jobid}.gro
  cd $locpath/tmp
  mummi_createsim \
    --fstype simple \
    --patch ${jobid} \
    --inpath $(pwd) \
    --outpath $locpath/createsim \
    --outlocal $locpath/tmp \
    --logpath $locpath \
    --loglevel 2 \
    --gromacs gmx \
    --mpi "gmx mdrun" \
    --mini \
    --mdrunopt " -ntmpi 1 -ntomp $OMP_NUM_THREADS -pin off"
    # For GPU add -nb gpu
