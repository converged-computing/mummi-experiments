apiVersion: mummi.converged-computing.org/v1alpha1
kind: MiniMummi
metadata:
  name: mummi-sample
spec:
  mlserver:
    image: 633731392008.dkr.ecr.us-east-1.amazonaws.com/mini-mummi:mlserver
    # This had to be started in interactive, then:
    # cd /opt/clones/mummi-ras/mummi_ras/ml/validators/
    # rm cg_validator.py
    # wget https://gist.githubusercontent.com/vsoch/f51ee349dfc5ebf4bd1019dd887073e8/raw/2901b827c50ba27b3c1c2f576f09b76cb09e2630/cg_validator.py
    # cd /pixi-env
    # pixi run /bin/bash /mummi_operator/kubernetes_start.sh
    interactive: true

  rabbitmq:
    image: 633731392008.dkr.ecr.us-east-1.amazonaws.com/mini-mummi:rabbitmq

  # Defaults to 6 mummi nnodes, interactive mode is for debugging
  manager:
    image: 633731392008.dkr.ecr.us-east-1.amazonaws.com/mini-mummi:wfmanager
    numberMaxSelectedPatchBuffer: 3
    numberMaxPatchesSelectionsPerIteration: 3
    nodes: 6
    
  # Jobs for the Mummi workflow manager to submit / orchestrate
  # Right now we use defaults for most things (bundle size, nodes, etc)
  jobs:
    cganalysis:
      image: 633731392008.dkr.ecr.us-east-1.amazonaws.com/mini-mummi:cganalysis
      config:
        # Note that cores per task is only used to get the full node (96)
        coresPerTask: 94
        nproc: 94
    createsim:
      image: 633731392008.dkr.ecr.us-east-1.amazonaws.com/mini-mummi:createsims
      config:
        coresPerTask: 6
        nproc: 94
